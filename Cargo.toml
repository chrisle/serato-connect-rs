[package]
name = "serato-connect-rs"
version = "0.1.0"
edition = "2021"
license = "MIT AND MPL-2.0"
description = "Serato history, library, audio metadata and OSC Remote protocol reader"
repository = "https://github.com/chrisle/serato-connect-rs"
include = ["src/**", "tests/**", "fixtures/**", "tools/regenerate.cjs", "tools/verify-reference.cjs", "tools/package*.json", "tools/reference/**", "tools/runtime/**", "/LICENSE", "/LICENSES/**", "/NOTICE.md", "/README.md", "/EXPORTS.md", "/Cargo.toml", "/Cargo.lock", ".github/**"]
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "=0.37.0", default-features = false, features = ["limits"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
mdns-sd = "=0.21.5"
hostname = "0.4"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/chrisle/onelibrary-connect-rs", rev = "b207f59fc87983286b679b4d9072fd9caa81e89a" }
